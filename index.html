<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест SVG — Creative Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="svg">Мой первый тест SVG</h1>
    <!-- Наш холст-сетка размером 400 на 200 пикселей -->
    <svg class="svg" viewBox="0 0 400 200" width="400" height="200" style="border: 2px dashed #ccc; background: #fafafa;">
        <circle cx="50" cy="50" r="30" fill="blue" stroke="blue" stroke-width="8"/>   <!-- 1. Нарисуй тут круг <circle> (пусть он будет синим) -->
        <rect x="120" y="20" width="60" height="60" fill="red" stroke="red" stroke-width="6"/>    <!-- 2. Нарисуй тут квадрат <rect> (пусть он будет красным) -->
        <!-- Эта линия-подчеркивание снизу уже гот/.", она служит ориентиром -->
        <line x1="20" y1="160" x2="380" y2="160" stroke="#333" stroke-width="4" />
        <text x="42" y="60">RED BLUE</text>
    </svg>
    <!--                сыркл.рект.лайн.текст. 
        Чтобы нарисовать круг, браузеру нужно знать, где его центр и какой он ширины.
    cx и cy — координаты центра круга (по X и Y).r — радиус (насколько круг большой)
        Чтобы нарисовать квадрат, нужно указать, где его левый верхний угол и его размеры.
    x и y — точка старта.width и height — ширина и высота
        Линия — это просто мостик от одной точки к другой.x1, y1 — где линия начинается.ъ
    x2, y2 — где линия заканчивается
        Прямо внутри графики можно написать красивую букву (например, первую букву названия студии "C")
    x и y — где разместить текст.

    fill — цвет заливки (внутри фигуры). Например: fill="red" или fill="none" (если нужен только контур)
    stroke — цвет контура (линии). Например: stroke="blue".
    stroke-width — толщина этого контура в пикселях. Например: stroke-width="4".
            <circle cx="50" cy="50" r="30" />
            <rect x="120" y="20" width="60" height="60" />
            <line x1="10" y1="150" x2="390" y2="150" />
            <text x="42" y="60">C</text>
    -->

</body>
</html>
