<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Делаем SVG - Проект</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. ШАПКА САЙТА -->
    <header class="studio-header">
        <div class="logo">
        <svg viewBox="0 0 100 100" width="50" height="50">
            <circle class="logo-circle" cx="50" cy="50" r="40" fill="none" />
            <text x="35" y="62" fill="#333" font-size="36px" font-family="sans-serif" font-weight="bold">C</text>
        </svg>
        </div>
        
        <nav class="studio-nav">
            <ul class="nav-menu">
                <li><a href="#home">Главная</a></li>
                <li><a href="#features">Преимущества</a></li>
                <li><a href="#projects">Работы</a></li>
            </ul>
        </nav>

        <!-- КНОПКА С SVG-СТРЕЛОЧКОЙ, КОТОРУЮ ТЫ ПРИДУМАЛ! -->
        <a href="#start" class="btn-start">
            Начать проект
            <!-- Сюда мы вставим маленькую стрелочку-плей -->
        </a>
    </header>

    <!-- 2. HERO-БЛОК (ГЛАВНЫЙ ЭКРАН) -->

        <div class="hero-content">
            <h1>Создаём дизайн, который работает</h1>
            <p>Мы объединяем искусство и технологии, чтобы ваш бизнес рос быстрее и привлекал клиентов.</p>
        <div class="hero-illustration">
    <svg viewBox="0 0 400 200" width="400" height="200">
        <circle class="circle" cx="200" cy="100" r="80" stroke-width="8"/> 
        <!-- Эта линия-подчеркивание снизу уже гот/.", она служит ориентиром -->
        <polygon class="polygon" points="200,20 131,140 269,140"/>
        <text class="text" x="200" y="100">STUDIO</text>            
    </svg>
        </div>
            <a href="#explore" class="btn-hero">Узнать больше</a>
        </div>

        
    </main>
