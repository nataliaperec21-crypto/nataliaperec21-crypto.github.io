<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Делаем SVG - Проект</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="studio-header">
        <div class="logo">
            <svg viewBox="0 0 100 100" width="50" height="50">
                <circle class="logo-circle" cx="50" cy="50" r="40" fill="none" />
                <text x="35" y="62" fill="#333" font-size="36px" font-family="sans-serif" font-weight="bold">C</text>
            </svg>
        </div>
        
        <nav class="studio-nav">
            <ul class="nav-menu">
                <li><a href="#home">Главная</a></li>
                <li><a href="#features">Преимущества</a></li>
                <li><a href="#projects">Работы</a></li>
            </ul>
        </nav>

        <a href="#start" class="btn-start">
            Начать проект
            <svg viewBox="0 0 20 20" width="16" height="16">
                <polygon points="4,4 4,16 14,10" fill="currentColor" />
            </svg>
        </a>
    </header>

    <main class="hero-section" id="home">
        <div class="hero-content">
            <h1>Создаём дизайн, который работает</h1>
            <p>Мы объединяем искусство и технологии, чтобы ваш бизнес рос быстрее и привлекал клиентов.</p>
            
            <div class="hero-illustration">
                <svg viewBox="0 0 400 200" width="400" height="200">
                    <circle class="circle" cx="200" cy="100" r="80" fill="none" /> 
                    <polygon class="polygon" points="200,20 131,140 269,140" fill="none" />
                    <polyline points="180,20 220,90 170,110 210,180" fill="none" stroke="#ffcc00" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                    <text class="text" x="200" y="107" font-size="20px" text-anchor="middle">STUDIO</text>            
                </svg>
            </div>
            
            <a href="#explore" class="btn-hero">Узнать больше</a>
        </div>
    </main>

</body>
</html>
